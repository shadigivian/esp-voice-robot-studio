; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM7
monitor_port = COM7
upload_speed = 460800
board_build.flash_mode = dio
board_build.f_flash = 80000000L
extra_scripts = pre:tools/xmc_bootloader/platformio_pre.py

lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    links2004/WebSockets@^2.4.1
    ESP32Async/ESPAsyncWebServer@^3.7.6
    https://github.com/esp-arduino-libs/ESP32_Button.git#v0.0.1
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.0.1
    https://github.com/pschatzmann/arduino-libopus.git#a1.1.0

board_build.arduino.memory_type = dio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.filesystem = spiffs
board_build.partitions = partition.csv
upload_protocol = esptool
monitor_filters =
  esp32_exception_decoder
  time
build_unflags = -std=gnu++11

build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_HAS_PSRAM
    -D TOUCH_SENSOR_ENABLE=1        ; Enable touch sensor driver
    -D ELATO_WIFI_TX_POWER=34       ; 8.5 dBm: bounded link test with brownout protection enabled
    -D ELATO_USB_WIFI_SETUP=1       ; Configure saved Wi-Fi through USB
    -D ELATO_DIAGNOSTICS=1          ; Heap telemetry while checking audio
    -D ELATO_DISABLE_RGB_LED=1      ; This circuit has no separate RGB LED
    -D ELATO_AMP_SD_PIN=-1          ; MAX98357A SD is tied to 5V, not a GPIO
